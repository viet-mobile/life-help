name: CI

# Verification only. This workflow never deploys and needs no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (learning platform code)
        run: npm run lint:learn
      - name: Unit + database tests
        run: npm test
      - name: Build (Next.js)
        run: npm run build:next
        env:
          # Public, non-secret placeholders so the build never touches a real project.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      - name: Client bundle must not contain secret keys
        run: node scripts/learn/check-no-secrets.mjs
