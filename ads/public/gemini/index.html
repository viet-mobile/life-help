function getPack(lang) {
  if (LANG_PACK[lang]) return LANG_PACK[lang];
  const ext = EXTRA_TERMS[lang];
  const baseEn = LANG_PACK.en;
  if (!ext) return baseEn;
  return {
    name: ext.name,
    terms: {
      archFormula: ext.arch,
      ballH: ext.bH,
      dist: ext.d,
      peakH: ext.pH,
      rimH: ext.rH,
      adjEq: ext.adj,
      answer: ext.ans
    },
    scoreBefore: baseEn.scoreBefore,
    scoreAfter: baseEn.scoreAfter,
    mathQ: baseEn.mathQ,
    engQ: baseEn.engQ,
    korQ: baseEn.korQ,
    korA: `${ext.ans}: 대역전! (Dae-yeok-jeon!)`,
    lifeQ: baseEn.lifeQ
  };
}

// OS 내장 TTS 음성 유무 실시간 점검
function checkTtsAvailability(langCode) {
  const badge = document.getElementById("ttsStatusBadge");
  if (!("speechSynthesis" in window)) {
    badge.innerHTML = `<span class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500"></span><span>이 브라우저는 Web Speech TTS를 지원하지 않습니다.</span>`;
    return;
  }
  const voices = window.speechSynthesis.getVoices();
  const target = langCode === "arz" ? "ar" : langCode === "pcm" ? "en" : langCode.split("-")[0];
  const found = voices.some(v => v.lang.toLowerCase().startsWith(target.toLowerCase()));

  const noTtsLangs = ["tet", "pcm", "my", "km", "ne", "si", "mn", "uz", "am"];
  if (found && !noTtsLangs.includes(langCode)) {
    badge.innerHTML = `<span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span>현재 기기 OS에서 [${langCode}] TTS 음성 지원됨</span>`;
  } else {
    badge.innerHTML = `<span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400"></span><span>현재 OS에 [${langCode}] 기본 음성 없음 (클라우드 TTS 권장)</span>`;
  }
}
if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => checkTtsAvailability(currentLang);
}

// Web Audio API 효과음
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playBounceSfx() {
  if (!document.getElementById("sfxToggle").checked) return;
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(140, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(42, audioCtx.currentTime + 0.14);
  gain.gain.setValueAtTime(0.38, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}
function playSwishOrCrashSfx(isCrash = false) {
  if (!document.getElementById("sfxToggle").checked) return;
  initAudio();
  const dur = isCrash ? 0.55 : 0.25;
  const bufferSize = audioCtx.sampleRate * dur;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * (isCrash ? 0.18 : 0.08)));
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = isCrash ? "lowpass" : "bandpass";
  filter.frequency.value = isCrash ? 220 : 1800;
  const gain = audioCtx.createGain();
  gain.gain.value = isCrash ? 0.75 : 0.35;
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

// 4. 175cm 표준 인체 비례(7.5등신) & 2관절 고정 길이 역운동학(IK) 캐릭터 엔진
const canvas = document.getElementById("adCanvas");
const ctx = canvas.getContext("2d");
const NAVY = "#1B2A4A";
const RED = "#E63946";

function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }

// ★ 핵심: 상완(L1)과 전완(L2), 허벅지(L1)와 종아리(L2) 길이가 절대 변하지 않도록 고정하는 2관절 IK 솔버
function solveLimbIK(x0, y0, targetX, targetY, L1, L2, bendDir = 1) {
  let dx = targetX - x0;
  let dy = targetY - y0;
  let dist = Math.hypot(dx, dy);
  const maxReach = L1 + L2 - 0.5;
  const minReach = Math.abs(L1 - L2) + 0.5;

  // 목표점이 팔다리 길이보다 멀면 팔다리 최대 길이까지만 뻗도록 강제 클램핑 (팔이 비정상적으로 늘어나는 현상 원천 차단!)
  if (dist > maxReach) {
    dx = (dx / dist) * maxReach;
    dy = (dy / dist) * maxReach;
    dist = maxReach;
  } else if (dist < minReach) {
    dx = (dx / dist) * minReach;
    dy = (dy / dist) * minReach;
    dist = minReach;
  }

  const baseAngle = Math.atan2(dy, dx);
  const cosAngle1 = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
  const angle1 = Math.acos(Math.max(-1, Math.min(1, cosAngle1)));
  const jointAngle = baseAngle + bendDir * angle1;

  const jx = x0 + Math.cos(jointAngle) * L1;
  const jy = y0 + Math.sin(jointAngle) * L1;
  const ex = x0 + dx;
  const ey = y0 + dy;
  return { jx, jy, ex, ey };
}

function drawTaperedSegment(x1, y1, x2, y2, r1, r2, color) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 0.1) return;
  const nx = -dy / len, ny = dx / len;

  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1 + nx * r1, y1 + ny * r1);
  ctx.lineTo(x2 + nx * r2, y2 + ny * r2);
  ctx.lineTo(x2 - nx * r2, y2 - ny * r2);
  ctx.lineTo(x1 - nx * r1, y1 - ny * r1);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x1, y1, r1, 0, Math.PI * 2);
  ctx.arc(x2, y2, r2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// 175cm (175px) 7.5등신 표준 인체 실루엣 렌더러
// 골격 치수 상수 (양팔, 양다리 길이 100% 대칭 고정)
const HUMAN_175 = {
  headRadius: 11.5, // 머리 지름 23px (23cm * 7.5 = 172.5cm)
  torsoLen: 54,     // 어깨~골반 54px
  upperArm: 29,     // 상완 29px
  foreArm: 27,      // 전완 27px
  thigh: 43,        // 허벅지 43px
  calf: 41          // 종아리 41px
};

function drawAthleticHuman175(hipX, hipY, floorY, config) {
  ctx.save();
  const lean = config.torsoLean || 0.08; // 자연스러운 전경 각도(라디안)

  // 바닥 그림자
  const heightOffFloor = Math.max(0, (floorY - 84) - hipY);
  const shadowScale = Math.max(0.35, 1 - heightOffFloor / 320);
  ctx.fillStyle = "rgba(27, 42, 74, 0.14)";
  ctx.beginPath();
  ctx.ellipse(hipX, floorY + 2, 42 * shadowScale, 8 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // 어깨 중심 및 머리 중심 계산
  const shoulderX = hipX + Math.sin(lean) * HUMAN_175.torsoLen;
  const shoulderY = hipY - Math.cos(lean) * HUMAN_175.torsoLen;
  const neckX = shoulderX + Math.sin(lean) * 9;
  const neckY = shoulderY - Math.cos(lean) * 9;
  const headX = shoulderX + Math.sin(lean) * 23;
  const headY = shoulderY - Math.cos(lean) * 23;

  // 1) 왼다리 & 오른다리 (고정 길이 IK: 허벅지 43px + 종아리 41px, 무릎은 앞쪽(+1)으로만 굽혀짐)
  const lLeg = solveLimbIK(hipX - 4, hipY, config.lFootX, config.lFootY, HUMAN_175.thigh, HUMAN_175.calf, -1);
  const rLeg = solveLimbIK(hipX + 4, hipY, config.rFootX, config.rFootY, HUMAN_175.thigh, HUMAN_175.calf, -1);

  // 2) 왼팔 & 오른팔 (고정 길이 IK: 상완 29px + 전완 27px, 팔꿈치는 뒤쪽(+1)으로 자연스럽게 굽혀짐)
  const lArm = solveLimbIK(shoulderX - 5, shoulderY + 3, config.lHandX, config.lHandY, HUMAN_175.upperArm, HUMAN_175.foreArm, 1);
  const rArm = solveLimbIK(shoulderX + 5, shoulderY + 3, config.rHandX, config.rHandY, HUMAN_175.upperArm, HUMAN_175.foreArm, 1);

  // 뒤쪽 팔(왼팔) & 뒤쪽 다리(왼다리) 먼저 렌더링
  drawTaperedSegment(shoulderX - 5, shoulderY + 3, lArm.jx, lArm.jy, 7.5, 6.2, NAVY);
  drawTaperedSegment(lArm.jx, lArm.jy, lArm.ex, lArm.ey, 6.2, 5.0, NAVY);

  drawTaperedSegment(hipX - 4, hipY, lLeg.jx, lLeg.jy, 10.5, 8.0, NAVY);
  drawTaperedSegment(lLeg.jx, lLeg.jy, lLeg.ex, lLeg.ey, 8.0, 6.0, NAVY);
  // 왼발 스니커즈 실루엣
  drawTaperedSegment(lLeg.ex, lLeg.ey, lLeg.ex + 13, lLeg.ey + 2, 6.0, 5.2, NAVY);

  // 몸통 (상체 역삼각형 테이퍼드 실루엣: 어깨 반폭 14.5px -> 허리/골반 반폭 11px)
  drawTaperedSegment(shoulderX, shoulderY, hipX, hipY, 14.5, 11.0, NAVY);
  // 목
  drawTaperedSegment(shoulderX, shoulderY, neckX, neckY, 6.2, 5.5, NAVY);
  // 머리 (7.5등신 비례의 약간 타원형 두상)
  ctx.fillStyle = NAVY;
  ctx.beginPath();
  ctx.ellipse(headX, headY, HUMAN_175.headRadius * 0.92, HUMAN_175.headRadius * 1.08, lean * 0.5, 0, Math.PI * 2);
  ctx.fill();

  // 앞쪽 다리(오른다리) 렌더링
  drawTaperedSegment(hipX + 4, hipY, rLeg.jx, rLeg.jy, 10.5, 8.0, NAVY);
  drawTaperedSegment(rLeg.jx, rLeg.jy, rLeg.ex, rLeg.ey, 8.0, 6.0, NAVY);
  drawTaperedSegment(rLeg.ex, rLeg.ey, rLeg.ex + 13, rLeg.ey + 2, 6.0, 5.2, NAVY);

  // 앞쪽 팔(오른팔) 렌더링
  drawTaperedSegment(shoulderX + 5, shoulderY + 3, rArm.jx, rArm.jy, 7.5, 6.2, NAVY);
  drawTaperedSegment(rArm.jx, rArm.jy, rArm.ex, rArm.ey, 6.2, 5.0, NAVY);

  ctx.restore();
  return { rHandActualX: rArm.ex, rHandActualY: rArm.ey, lHandActualX: lArm.ex, lHandActualY: lArm.ey };
}

function getAsymmetricParabolaPoint(s) {
  const xMeters = s * 4.6;
  const xv = 2.5625;
  const a = 0.22861;
  const yMeters = -a * Math.pow(xMeters - xv, 2) + 4.0;
  const px = lerp(540, 1022, s);
  const py = 530 - yMeters * 80;
  return { px, py, xMeters, yMeters };
}

function drawPureRedBall(x, y, radius) {
  ctx.save();
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawUrlWithRedBalls(domainStr, x, y, fontSize, textColor = "#FFFFFF") {
  ctx.save();
  ctx.font = `900 ${fontSize}px Inter, sans-serif`;
  ctx.fillStyle = textColor;
  const parts = domainStr.split(".");
  let cursorX = x;
  const ballRadius = Math.max(4, fontSize * 0.13);
  const gap = fontSize * 0.22;

  for (let i = 0; i < parts.length; i++) {
    ctx.fillText(parts[i], cursorX, y);
    cursorX += ctx.measureText(parts[i]).width;
    if (i < parts.length - 1) {
      cursorX += gap;
      drawPureRedBall(cursorX + ballRadius, y - fontSize * 0.26, ballRadius);
      cursorX += ballRadius * 2 + gap;
    }
  }
  ctx.restore();
}

function drawHoop(x, y, breakProgress = 0) {
  ctx.save();
  ctx.strokeStyle = "#CBD5E1";
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(x + 34, y - 40);
  ctx.lineTo(x + 85, y - 40);
  ctx.lineTo(x + 85, 530);
  ctx.stroke();

  ctx.strokeStyle = NAVY;
  ctx.lineWidth = 8;
  ctx.strokeRect(x + 20, y - 95, 14, 110);

  ctx.translate(x + 20, y);
  ctx.rotate(-breakProgress * 0.65);

  ctx.strokeStyle = RED;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(-75, 0);
  ctx.lineTo(0, 0);
  ctx.stroke();

  ctx.strokeStyle = "#94a3b8";
  ctx.lineWidth = 2.5;
  for (let i = 0; i <= 4; i++) {
    const nx = lerp(-70, -5, i / 4);
    ctx.beginPath();
    ctx.moveTo(nx, 3);
    ctx.lineTo(nx + (i < 2 ? 8 : -8), 52);
    ctx.stroke();
  }

  if (breakProgress > 0.05) {
    ctx.strokeStyle = RED;
    ctx.lineWidth = 3;
    for (let k = 0; k < 5; k++) {
      const ang = (k / 5) * Math.PI - Math.PI * 0.8;
      const dist = 15 + breakProgress * 45;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * dist, Math.sin(ang) * dist);
      ctx.stroke();
    }
  }
  ctx.restore();
}

let lastBounceIndex = -1;
let swishPlayed = false;
let answerSpoken = false;

function drawFrame(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#F8FAFC";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const floorY = 530;
  ctx.strokeStyle = "#CBD5E1";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, floorY);
  ctx.lineTo(canvas.width, floorY);
  ctx.stroke();

  const hoopX = 1040, hoopY = 286; // 3.05m
  const pack = getPack(currentLang);
  const qaObj = getCurrentQA();

  if (currentAdType === "korean" && t < 6.5) {
    const isScored = t >= 5.6;
    ctx.save();
    ctx.fillStyle = NAVY;
    ctx.beginPath();
    ctx.roundRect(80, 50, 420, 78, 16);
    ctx.fill();
    ctx.fillStyle = isScored ? "#4ADE80" : RED;
    ctx.font = "900 26px Inter, monospace";
    ctx.fillText(isScored ? "HOME 81 : 80 AWAY" : "HOME 78 : 80 AWAY", 105, 90);
    ctx.fillStyle = "#F8FAFC";
    ctx.font = "700 15px 'Noto Sans KR', Inter, sans-serif";
    ctx.fillText(isScored ? pack.scoreAfter : pack.scoreBefore, 105, 115);
    ctx.restore();
  }

  // 캐릭터 골반 기준 높이: 서 있을 때 바닥(530)에서 82px 위(448px)
  let hipX = 240, hipY = floorY - 82;
  let ballX = 280, ballY = 440;
  const ballRadius = 18;
  let hoopBreak = 0;

  let charConfig = {
    torsoLean: 0.12,
    lFootX: hipX - 18, lFootY: floorY - 3,
    rFootX: hipX + 18, rFootY: floorY - 3,
    lHandX: hipX - 22, lHandY: hipY - 12,
    rHandX: hipX + 32, rHandY: hipY - 5
  };

  if (t < 3.2) {
    // [구간 1] 자연스러운 드리블 워킹 & 1.8~2.5초 헤지테이션 페이크 모션
    const p = t / 3.2;
    const fakeOffset = (t > 1.8 && t < 2.5) ? Math.sin((t - 1.8) * Math.PI * 3) * 28 : 0;
    hipX = lerp(160, 485, p) + fakeOffset;

    const cycle = t * 9.5;
    const stride = Math.sin(cycle);
    const liftL = Math.max(0, -Math.cos(cycle)) * 18;
    const liftR = Math.max(0, Math.cos(cycle)) * 18;
    hipY = (floorY - 80) + Math.abs(stride) * 4;

    charConfig.torsoLean = (t > 1.8 && t < 2.5) ? 0.24 : 0.14;
    charConfig.lFootX = hipX - stride * 28;
    charConfig.lFootY = (floorY - 3) - liftL;
    charConfig.rFootX = hipX + stride * 28;
    charConfig.rFootY = (floorY - 3) - liftR;

    // 드리블 바운스 및 오른손 팔꿈치 연동
    const bouncePhase = Math.abs(Math.sin(t * 7.5));
    ballX = hipX + 36;
    const handLowestY = hipY + 8;
    const handHighestY = hipY - 22;
    charConfig.rHandX = hipX + 34;
    charConfig.rHandY = lerp(handLowestY, handHighestY, bouncePhase);
    charConfig.lHandX = hipX - 20 - stride * 12;
    charConfig.lHandY = hipY - 18;

    ballY = lerp(floorY - ballRadius, charConfig.rHandY + ballRadius, bouncePhase);

    if (currentAdType === "english" && bouncePhase < 0.22) {
      ctx.save();
      ctx.font = "900 26px Inter, sans-serif";
      ctx.fillStyle = RED;
      ctx.fillText("BOUNCE! 💥", ballX - 40, floorY - 55);
      ctx.restore();
    }

    const bIdx = Math.floor(t * 7.5 / Math.PI);
    if (bIdx !== lastBounceIndex && isPlaying) {
      lastBounceIndex = bIdx;
      playBounceSfx();
    }
  } else if (t < 6.5) {
    // [구간 2] 과목별 하이라이트 액션
    const p = (t - 3.2) / 3.3;

    if (currentAdType === "life") {
      // 투핸드 파워 슬램덩크 (양팔 길이 고정 IK + 골대 파손)
      const jumpArc = Math.sin(p * Math.PI);
      hipX = lerp(485, hoopX - 55, Math.min(1, p * 1.25));
      hipY = (floorY - 82) - jumpArc * 185;

      charConfig.torsoLean = 0.18;
      // 두 무릎을 자연스럽게 접어 올림
      charConfig.lFootX = hipX - 18; charConfig.lFootY = hipY + 58;
      charConfig.rFootX = hipX + 8;  charConfig.rFootY = hipY + 52;
      // 양손을 머리 위 공 위치로 모음
      charConfig.lHandX = hipX + 18; charConfig.lHandY = hipY - 92;
      charConfig.rHandX = hipX + 24; charConfig.rHandY = hipY - 92;

      if (p < 0.65) {
        ballX = hipX + 22;
        ballY = hipY - 104;
      } else {
        const dunkP = (p - 0.65) / 0.35;
        hoopBreak = Math.min(1, dunkP * 1.4);
        ballX = hoopX - 18;
        ballY = lerp(hoopY + 15, floorY - ballRadius, dunkP);
        if (!swishPlayed && isPlaying) { swishPlayed = true; playSwishOrCrashSfx(true); }
      }
    } else if (currentAdType === "english") {
      // 영어: 바운스 패스 후 점프 리바운드 캐치
      const bounceArc = Math.abs(Math.sin(p * Math.PI * 2));
      hipX = lerp(485, 810, p);
      const stride = Math.sin(t * 11);
      charConfig.lFootX = hipX - stride * 26; charConfig.lFootY = floorY - 3;
      charConfig.rFootX = hipX + stride * 26; charConfig.rFootY = floorY - 3;
      charConfig.rHandX = hipX + 28; charConfig.rHandY = hipY - 45;
      charConfig.lHandX = hipX - 18; charConfig.lHandY = hipY - 20;

      ballX = lerp(525, hoopX - 25, p);
      ballY = lerp(floorY - ballRadius, hoopY - 25, bounceArc);
      if (bounceArc < 0.2) {
        ctx.save();
        ctx.font = "900 30px Inter, sans-serif";
        ctx.fillStyle = RED;
        ctx.fillText("THUMP! BOUNCE!", ballX - 90, floorY - 40);
        ctx.restore();
      }
    } else {
      // ★ 수학 & 한국어: 정교한 원모션 점프슛 (출발 높이 2.5m = y:330px 에서 릴리즈)
      const jumpArc = p < 0.35 ? Math.sin((p / 0.35) * Math.PI) : 0;
      hipX = 505;
      hipY = (floorY - 82) - jumpArc * 38;
      charConfig.torsoLean = 0.04;
      charConfig.lFootX = hipX - 12; charConfig.lFootY = hipY + 80;
      charConfig.rFootX = hipX + 12; charConfig.rFootY = hipY + 80;
      // 슈팅 팔로우스루 자세 (IK가 팔 길이를 일정하게 유지)
      charConfig.rHandX = hipX + 32; charConfig.rHandY = hipY - 96;
      charConfig.lHandX = hipX + 18; charConfig.lHandY = hipY - 72;

      // ★ 수학: 사다리꼴 색칠을 완전히 제거하고, 오직 공이 그린 '순수 포물선 활꼴(3.71m²)'만 강조!
      if (currentAdType === "math") {
        ctx.save();
        // 순수 포물선 활꼴 내부만 빨간 반투명 영역으로 채움
        ctx.fillStyle = "rgba(230, 57, 70, 0.22)";
        ctx.beginPath();
        ctx.moveTo(540, 330); // 출발점 (2.5m)
        for (let s = 0; s <= 1.001; s += 0.025) {
          const pt = getAsymmetricParabolaPoint(Math.min(1, s));
          ctx.lineTo(pt.px, pt.py);
        }
        ctx.lineTo(540, 330); // 골대 림(3.05m)에서 출발점(2.5m)으로 바로 닫아 사다리꼴 배제!
        ctx.closePath();
        ctx.fill();

        // 활꼴 밑변(양 끝점 2.5m ~ 3.05m 연결 현) 점선
        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = NAVY;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(540, 330);
        ctx.lineTo(1022, 286);
        ctx.stroke();

        // 포물선 궤적 실선
        ctx.setLineDash([8, 6]);
        ctx.strokeStyle = RED;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        for (let s = 0; s <= 1.001; s += 0.025) {
          const pt = getAsymmetricParabolaPoint(Math.min(1, s));
          if (s === 0) ctx.moveTo(pt.px, pt.py); else ctx.lineTo(pt.px, pt.py);
        }
        ctx.stroke();

        // 치수 보조선 및 수치(2.5m, 4.0m, 3.05m, 4.6m)
        const peakPt = getAsymmetricParabolaPoint(2.5625 / 4.6);
        ctx.fillStyle = NAVY;
        ctx.font = "800 14px Inter, sans-serif";
        ctx.fillText("2.5m", 495, 335);
        ctx.fillText("4.0m", peakPt.px - 18, peakPt.py - 10);
        ctx.fillText("3.05m", 1030, 282);
        ctx.fillText("4.6m", 765, 326);

        // 좌측 상단 물리 조건 안내판 (46개 언어로 번역 출력)
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(27, 42, 74, 0.94)";
        ctx.beginPath();
        ctx.roundRect(45, 32, 465, 138, 16);
        ctx.fill();

        ctx.fillStyle = "#F8FAFC";
        ctx.font = "700 15px 'Noto Sans KR', Inter, sans-serif";
        qaObj.specLines.forEach((line, idx) => {
          ctx.fillText("• " + line, 65, 64 + idx * 29);
        });
        ctx.restore();
      }

      if (p < 0.78) {
        const s = p / 0.78;
        const pt = getAsymmetricParabolaPoint(s);
        ballX = pt.px;
        ballY = pt.py;
      } else {
        const s = (p - 0.78) / 0.22;
        ballX = 1022;
        ballY = lerp(hoopY + 10, floorY - ballRadius, s);
        if (!swishPlayed && isPlaying) { swishPlayed = true; playSwishOrCrashSfx(false); }
      }
    }
  } else {
    // [구간 3] (6.5 ~ 10.0초): LIFE.HELP 로고 시그니처 포즈 (175cm 균형 잡힌 실루엣이 공을 한 손 위에 든 모습)
    if (currentAdType === "life") hoopBreak = 1;
    const p = Math.min(1, (t - 6.5) / 0.65);
    hipX = lerp(650, 215, p);
    hipY = floorY - 82;

    charConfig.torsoLean = 0.04;
    charConfig.lFootX = hipX - 18; charConfig.lFootY = floorY - 3;
    charConfig.rFootX = hipX + 18; charConfig.rFootY = floorY - 3;
    charConfig.lHandX = hipX - 24; charConfig.lHandY = hipY - 12;
    charConfig.rHandX = hipX + 38; charConfig.rHandY = hipY - 92;
  }

  drawHoop(hoopX, hoopY, hoopBreak);
  const hands = drawAthleticHuman175(hipX, hipY, floorY, charConfig);

  if (t >= 6.5) {
    // 엔드카드에서는 캐릭터의 실제 오른손 끝(IK 계산 결과) 바로 위에 빨간 공이 정확히 안착
    ballX = hands.rHandActualX;
    ballY = hands.rHandActualY - ballRadius - 4;
  }
  drawPureRedBall(ballX, ballY, ballRadius);

  const domainText = getTargetDomain();

  if (t >= 6.5) {
    if (!answerSpoken && isPlaying) {
      answerSpoken = true;
      const ttsFinal = [...qaObj.endLines, qaObj.catchphrase].join(". ");
      speakText(ttsFinal);
    }
    const cardAlpha = Math.min(1, (t - 6.5) / 0.45);
    ctx.save();
    ctx.globalAlpha = cardAlpha;
    ctx.fillStyle = NAVY;
    ctx.beginPath();
    ctx.roundRect(380, 80, 845, 425, 28);
    ctx.fill();

    // URL 주소 (점 2개를 순수 빨간 공으로 렌더링)
    drawUrlWithRedBalls(domainText, 425, 162, 44, "#FFFFFF");

    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(425, 190);
    ctx.lineTo(1180, 190);
    ctx.stroke();

    if (currentAdType === "math") {
      // 1) 아르키메데스의 포물선 넓이 공식: 면적 = ⅔ × 밑변 × 높이
      ctx.fillStyle = "#FDE047";
      ctx.font = "800 20px 'Noto Sans KR', Inter, sans-serif";
      wrapCanvasText(ctx, qaObj.endLines[0], 425, 232, 750, 28);

      // 2) 비대칭 높이 반영 순수 활꼴 조정식
      ctx.fillStyle = "#E2E8F0";
      ctx.font = "700 18px 'Noto Sans KR', Inter, sans-serif";
      wrapCanvasText(ctx, qaObj.endLines[1], 425, 292, 750, 26);

      // 3) 최종 해답 (3.71m²)
      ctx.fillStyle = "#4ADE80";
      ctx.font = "900 28px 'Noto Sans KR', Inter, sans-serif";
      ctx.fillText(qaObj.endLines[2], 425, 355);

      // 4) 수학 전용 다국어 캐치프레이즈
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "800 21px 'Noto Sans KR', Inter, sans-serif";
      wrapCanvasText(ctx, "✨ " + qaObj.catchphrase, 425, 415, 750, 30);
    } else if (currentAdType === "english" || currentAdType === "korean") {
      // 정답 제시 후 과목별 다국어 캐치프레이즈 제시
      ctx.fillStyle = "#4ADE80";
      ctx.font = "900 32px 'Noto Sans KR', Inter, sans-serif";
      wrapCanvasText(ctx, qaObj.endLines[0], 425, 260, 750, 40);

      ctx.fillStyle = "#FFFFFF";
      ctx.font = "800 24px 'Noto Sans KR', Inter, sans-serif";
      wrapCanvasText(ctx, "✨ " + qaObj.catchphrase, 425, 360, 750, 36);
    } else {
      // 생활 플랫폼 캐치프레이즈 마무리
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "800 28px 'Noto Sans KR', Inter, sans-serif";
      wrapCanvasText(ctx, qaObj.catchphrase, 425, 285, 750, 42);
    }
    ctx.restore();
  } else {
    ctx.save();
    ctx.fillStyle = "rgba(27, 42, 74, 0.94)";
    ctx.beginPath();
    ctx.roundRect(90, 560, 1100, 125, 22);
    ctx.fill();

    drawUrlWithRedBalls(domainText, 130, 600, 20, "#CBD5E1");

    ctx.fillStyle = "#FFFFFF";
    ctx.font = "700 22px 'Noto Sans KR', Inter, sans-serif";
    wrapCanvasText(ctx, "Q. " + qaObj.q, 130, 636, 1020, 30);
    ctx.restore();
  }
}

function wrapCanvasText(context, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + " ";
    if (context.measureText(testLine).width > maxWidth && n > 0) {
      context.fillText(line, x, y);
      line = words[n] + " ";
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  context.fillText(line, x, y);
}

// 5. 재생 및 녹화
function startPlayback() {
  if (animFrame) cancelAnimationFrame(animFrame);
  startTime = performance.now();
  isPlaying = true;
  lastBounceIndex = -1;
  swishPlayed = false;
  answerSpoken = false;

  const { q } = getCurrentQA();
  speakText(q);

  function tick(now) {
    const elapsed = (now - startTime) / 1000;
    const clamped = Math.min(DURATION, elapsed);
    document.getElementById("timeLabel").textContent = `${clamped.toFixed(1)}s / 10.0s`;
    document.getElementById("progressBar").style.width = `${(clamped / DURATION) * 100}%`;
    drawFrame(clamped);

    if (elapsed < DURATION) {
      animFrame = requestAnimationFrame(tick);
    } else {
      isPlaying = false;
    }
  }
  animFrame = requestAnimationFrame(tick);
}

document.getElementById("playBtn").addEventListener("click", startPlayback);

document.getElementById("recordBtn").addEventListener("click", () => {
  const stream = canvas.captureStream(60);
  const recorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
  const chunks = [];
  const btn = document.getElementById("recordBtn");
  btn.textContent = "⏺ 녹화 중 (10초)...";
  btn.disabled = true;

  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${getTargetDomain().toLowerCase()}-${currentLang}-10s-ad.webm`;
    a.click();
    URL.revokeObjectURL(url);
    btn.textContent = "🔴 10초 영상 파일 저장 (.webm)";
    btn.disabled = false;
  };

  recorder.start();
  startPlayback();
  setTimeout(() => {
    if (recorder.state === "recording") recorder.stop();
  }, DURATION * 1000 + 150);
});

updateLangOptions();
