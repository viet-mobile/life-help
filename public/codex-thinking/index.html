:root{--ink:#172a35;--muted:#526773;--paper:#faf9f5;--line:#dbe2df;--accent:#146856;--warm:#fff0d3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 system-ui,-apple-system,sans-serif}button,select,textarea,input{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:white;color:var(--ink)}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #dc931b;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:white;border-color:var(--accent)}header{border-bottom:1px solid var(--line);background:#fff;padding:24px max(20px,calc((100vw - 1200px)/2))}header h1{font-size:clamp(25px,4vw,38px);margin:0;line-height:1.25;letter-spacing:-.04em}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.09em}.intro{max-width:800px;color:var(--muted);margin:12px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.shell{max-width:1200px;margin:auto;padding:28px 20px 64px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}nav{align-self:start;position:sticky;top:20px}.taskbtn{width:100%;text-align:left;margin:0 0 8px;line-height:1.4}.taskbtn small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.taskbtn[aria-current=true]{border-color:var(--accent);box-shadow:inset 4px 0 var(--accent);background:#edf6f1}.progress{font-size:13px;color:var(--muted);margin:12px 0}article{min-width:0}.meta{color:var(--accent);font-size:14px;font-weight:700}h2{font-size:clamp(25px,3vw,34px);line-height:1.3;margin:8px 0 18px;letter-spacing:-.03em}h3{font-size:20px;margin:0 0 10px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}.target{white-space:pre-wrap;background:#173b3c;color:#fff;font-size:18px;line-height:1.8}.small{font-size:14px;color:var(--muted)}.phase{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:800;margin-bottom:6px}.new{background:var(--warm);border-color:#edcf97}textarea{display:block;width:100%;min-height:155px;padding:14px;margin:14px 0 10px;border:1px solid #abbab4;border-radius:10px;resize:vertical;color:var(--ink);background:#fff}textarea[readonly]{background:#f3f5f3}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.answer{white-space:pre-wrap;border-left:3px solid #c3d8cf;padding-left:14px;overflow-wrap:anywhere}.check{padding:14px 0;border-top:1px solid var(--line)}.check label{display:block;font-weight:600;margin-bottom:8px}.check select{max-width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.score{background:#edf6f1;border-radius:10px;padding:12px}.sim{background:#f2f6f4;border-radius:12px;padding:16px;margin-top:14px}.sim input{width:75px;border:1px solid #acbbb3;border-radius:8px;padding:6px}.sim svg{display:block;max-width:100%;height:auto;margin-top:12px}.status{font-weight:650;margin-top:10px;white-space:pre-line}footer{max-width:1200px;margin:auto;padding:0 20px 30px;color:var(--muted);font-size:13px}.saved{min-height:24px}.hidden{display:none!important}.note{border-left:4px solid #d8a342;padding-left:14px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}summary{cursor:pointer;font-weight:700}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){.shell{display:block;padding-top:18px}nav{position:static;display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;padding-bottom:5px}nav .taskbtn{flex:0 0 205px}.panel{padding:18px}.compare{grid-template-columns:1fr}.target{font-size:16px}header{padding:20px}.toolbar button{font-size:14px}body{font-size:16px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body><header><div class="top"><div><div class="eyebrow">THINKING LAB · 01</div><h1 id="heading"></h1></div><label><span class="sr">Instruction language</span><select id="language"><option value="ko">한국어 안내</option><option value="en">English instructions</option></select></label></div><p class="intro" id="intro"></p><div class="toolbar"><button data-filter="all"></button><button data-filter="math"></button><button data-filter="english"></button><button data-filter="korean"></button><button id="export"></button></div><div id="progress" class="progress"></div></header><div class="shell"><nav id="list" aria-label="Tasks"></nav><main><article id="task"></article></main></div><footer id="footer"></footer><script>
const TASKS=[{"id": "M1", "subject": "math", "level": {"ko": "초등", "en": "Elementary"}, "title": {"ko": "같은 넓이, 다른 선택", "en": "Same area, different choices"}, "target": "정원 / Garden\n넓이 / Area: 24 m²\n울타리 / Fence available: 22 m\n직사각형, 네 변 모두 울타리 / Rectangle, fence on all four sides\n변 길이는 양의 정수 / Positive integer side lengths", "first": {"ko": "가능한 정원을 두 가지 설계하세요. 어느 쪽을 추천하나요? 넓이와 필요한 울타리를 확인하고, 추천한 이유를 쓰세요.", "en": "Design two possible gardens. Which do you recommend? Check the area and fence length, and give a reason for your choice."}, "new": {"ko": "새 조건: 긴 변을 따라 길이 8m인 교육용 화단을 곧게 놓아야 합니다. 정원 넓이와 울타리 양은 바뀌지 않습니다.", "en": "New constraint: an 8 m teaching bed must fit in a straight line along the longer side. The area and available fence stay the same."}, "second": {"ko": "처음 추천을 유지할까요, 바꿀까요? 새 조건을 만족하는 설계와 탈락하는 설계를 설명하세요.", "en": "Keep or change your recommendation? Explain which design meets the new constraint and which no longer does."}, "reason": {"ko": "처음에는 3×8(넓이 24, 둘레 22), 4×6(넓이 24, 둘레 20)이 모두 가능합니다. 울타리를 아끼면 4×6을, 길쭉한 공간을 원하면 3×8을 고를 수 있습니다. 새 조건에서는 3×8만 남습니다. 4×6은 넓이가 맞아도 긴 변이 6m입니다. 처음 답을 바꾸는 것은 오류가 아니라 조건에 따른 합리적 수정입니다.", "en": "Initially, 3×8 (area 24, perimeter 22) and 4×6 (area 24, perimeter 20) both work. Either recommendation can be justified. With the new constraint, only 3×8 remains: the 4×6 garden has a longest side of only 6 m. Revising a recommendation in response to a constraint is good reasoning."}, "checks": [{"ko": "서로 다른 두 설계의 넓이와 둘레를 확인했다.", "en": "I checked the area and perimeter of two different designs."}, {"ko": "추천 이유와 필수 조건을 구별했다.", "en": "I distinguished a preference from a requirement."}, {"ko": "새 조건 때문에 어떤 설계가 탈락하는지 설명했다.", "en": "I explained why a design fails the new constraint."}], "trap": {"ko": "“울타리가 가장 적게 드는 것이 언제나 최고다”는 결론에는 목적이라는 조건이 빠져 있습니다.", "en": "“The least fence is always best” ignores the purpose of the garden."}, "prereq": {"ko": "직사각형의 넓이·둘레, 곱셈", "en": "Rectangle area and perimeter; multiplication"}, "minutes": 8}, {"id": "M2", "subject": "math", "level": {"ko": "중등", "en": "Middle school"}, "title": {"ko": "어느 구간부터 고칠까?", "en": "Which leg should we improve?"}, "target": "A → B: 20 km, 20 km/h\nB → C: 20 km, 60 km/h\n정차 없음 / No stops\n제안 1 / Plan 1: A→B를 30 km/h로 / raise A→B to 30 km/h\n제안 2 / Plan 2: B→C를 120 km/h로 / raise B→C to 120 km/h", "first": {"ko": "민수는 전체 평균 속도가 (20+60)÷2=40이라고 합니다. 이 주장에 동의하나요? 또한 이동 시간을 더 줄이는 제안을 고르고 근거를 제시하세요.", "en": "Minsu says the overall average speed is (20+60)÷2=40. Do you agree? Choose the plan that saves more travel time and justify it."}, "new": {"ko": "새 정보: 두 제안 모두 비용은 같고, 매번 B에서 20분을 정차해야 합니다.", "en": "New information: both plans cost the same, and every trip now includes a 20-minute stop at B."}, "second": {"ko": "원래 이동의 정차 포함 평균 속도를 구하세요. 정차가 추가되면 추천할 제안도 바뀌나요? 계산 또는 시간 그림으로 설명하세요.", "en": "Find the original trip’s average speed including the stop. Does the stop change which plan you recommend? Use calculations or a timeline."}, "reason": {"ko": "원래 이동은 60분+20분=80분, 전체 평균은 40÷(4/3)=30 km/h입니다. 제안 1은 20분, 제안 2는 10분을 절약합니다. 공통 정차 20분을 포함하면 원래 총 100분이므로 평균은 24 km/h입니다. 두 제안에 같은 정차가 더해져도 절약 시간의 차이는 유지됩니다. 속도 증가량이 큰 제안이 항상 시간 절약도 큰 것은 아닙니다.", "en": "The original trip takes 60+20=80 minutes, so the average speed is 30 km/h. Plan 1 saves 20 minutes; Plan 2 saves 10. With the shared stop, the original trip takes 100 minutes and averages 24 km/h. Adding the same stop does not change the ranking of time savings. A larger speed increase does not necessarily save more time."}, "checks": [{"ko": "속도의 단순 평균 대신 전체 거리÷전체 시간을 썼다.", "en": "I used total distance divided by total time."}, {"ko": "두 제안의 절약 시간을 비교했다.", "en": "I compared the minutes saved by both plans."}, {"ko": "평균 속도의 변화와 추천 순위의 변화를 구별했다.", "en": "I distinguished a change in average speed from a change in ranking."}], "trap": {"ko": "두 구간은 거리가 같지만 걸리는 시간은 같지 않습니다.", "en": "The legs have equal distances, but unequal times."}, "prereq": {"ko": "거리·속력·시간, 분수", "en": "Distance, speed, time; fractions"}, "minutes": 10}, {"id": "M3", "subject": "math", "level": {"ko": "고등", "en": "High school"}, "title": {"ko": "둘 다 이겼는데 전체로는 졌다", "en": "Winning both groups, losing overall"}, "target": "관찰 자료 / Observational data\nA: 기초반 / beginner 9/10 성공, 심화반 / advanced 60/100 성공\nB: 기초반 / beginner 80/100 성공, 심화반 / advanced 5/10 성공\n분모는 수강생 수 / Denominators are student counts", "first": {"ko": "광고 담당자는 “전체 성공률이 더 높은 B가 모든 학생에게 더 좋은 수업”이라고 합니다. 계산과 반론을 제시하세요. 심화반 학생이라면 어떤 추가 정보가 필요한가요?", "en": "An advertiser says, “B has a higher overall success rate, so B is better for every student.” Calculate the rates and challenge the claim. What else would an advanced student need to know?"}, "new": {"ko": "새 정보: A 심화반은 사전 경험이 있는 학생만, B 심화반은 사전 경험이 없는 학생만 받았습니다.", "en": "New information: A’s advanced group admitted only students with prior experience; B’s admitted only students without prior experience."}, "second": {"ko": "새 정보로 처음 판단을 수정하세요. 수업 효과를 더 공정하게 비교할 연구를 설계하고, 이 자료만으로 결론낼 수 없는 것을 적으세요.", "en": "Revise your judgment. Design a fairer comparison of course effects and state what these data cannot establish."}, "reason": {"ko": "A 전체는 69/110≈62.7%, B는 85/110≈77.3%입니다. 그러나 기초반은 A 90% 대 B 80%, 심화반은 A 60% 대 B 50%입니다. 어려운 집단의 비중 차이로 전체 순위가 뒤집힐 수 있습니다. 새 정보는 같은 심화반 안에서도 경험이라는 교란 요인이 있음을 보여 줍니다. 관찰상 비율만으로 A의 인과적 우월성도 단정할 수 없습니다. 비슷한 사전 수준·경험별로 나눈 뒤 가능하다면 무작위 배정하고, 같은 성공 기준과 탈락자를 포함한 결과를 비교하는 설계가 더 낫습니다.", "en": "Overall, A is 69/110≈62.7% and B is 85/110≈77.3%. Yet A leads within each group: 90% versus 80%, and 60% versus 50%. Different group proportions can reverse the overall ranking. Prior experience adds confounding even within the advanced group. These observations do not prove a causal advantage for A either. A fairer study could stratify by prior level and experience, randomly assign where feasible, and use a common outcome with attrition reported."}, "checks": [{"ko": "전체 비율과 집단별 비율을 모두 계산했다.", "en": "I calculated both overall and within-group rates."}, {"ko": "집단 구성비와 교란 요인을 구별했다.", "en": "I distinguished group weighting from confounding."}, {"ko": "자료가 말하는 것과 인과적 주장을 구별했다.", "en": "I distinguished observed rates from causal claims."}], "trap": {"ko": "전체 순위를 뒤집는 것만으로 “그러므로 A가 무조건 더 좋다”도 증명되지 않습니다.", "en": "Reversing the overall ranking does not prove that A is always better."}, "prereq": {"ko": "비율·가중평균, 비교 연구의 기초", "en": "Proportions; weighted averages; basic study comparison"}, "minutes": 12}, {"id": "E1", "subject": "english", "level": {"ko": "초등", "en": "Elementary"}, "title": {"ko": "bank는 어디일까?", "en": "Which bank?"}, "target": "Alex: “Meet me by the bank at four.”\n지도 / Map:\n• a river bank beside a park\n• a money bank beside a school", "first": {"ko": "지금 어느 장소로 갈지 확실한가요? Alex에게 보낼 영어 질문 한 문장을 만드세요. 무엇을 확인하려는지도 설명하세요.", "en": "Can you be sure where to go? Write one English question to Alex and explain what it would clarify."}, "new": {"ko": "Alex가 덧붙였습니다: “I want to see the ducks.”", "en": "Alex adds: “I want to see the ducks.”"}, "second": {"ko": "이제 더 그럴듯한 장소는 어디인가요? 확실한 사실과 추측을 구별해 답하고, 필요하다면 마지막 확인 메시지를 쓰세요.", "en": "Which location is now more likely? Distinguish a fact from an inference, and write a final confirmation if needed."}, "reason": {"ko": "“Do you mean the river bank or the money bank?”처럼 장소의 모호함을 직접 줄이는 질문이 좋습니다. ducks는 강가 해석을 더 그럴듯하게 하지만, 반드시 그곳이라는 논리적 보장은 아닙니다. “The river bank by the park, right?”도 가능합니다. 처음부터 금융기관으로 단정하거나 시간만 다시 묻는 질문은 핵심 모호함을 해결하지 못합니다.", "en": "“Do you mean the river bank or the money bank?” directly resolves the ambiguity. Ducks make the river interpretation more likely, but do not logically guarantee it. “The river bank by the park, right?” is a useful final check. Asking only about the time leaves the location ambiguous."}, "checks": [{"ko": "bank의 두 의미를 확인했다.", "en": "I considered both meanings of bank."}, {"ko": "내 질문이 장소의 모호함을 줄인다.", "en": "My question reduces the location ambiguity."}, {"ko": "단서에 근거한 추측을 확실한 사실처럼 말하지 않았다.", "en": "I did not treat a plausible inference as certain."}], "trap": {"ko": "문법이 완벽하지 않아도 상대가 두 장소 중 하나를 고를 수 있는 질문이면 핵심 목적을 이룹니다.", "en": "Minor grammar errors need not defeat a question that clearly distinguishes the two places."}, "prereq": {"ko": "간단한 의문문, 장소 어휘", "en": "Simple questions; place vocabulary"}, "minutes": 6}, {"id": "E2", "subject": "english", "level": {"ko": "중등", "en": "Middle school"}, "title": {"ko": "공지의 예외를 읽는 법", "en": "Read the exception"}, "target": "School garden notice:\n“The garden opens to visitors on Mondays, Wednesdays and Fridays. Volunteers may visit on Tuesdays by prior arrangement. Please contact the office before you come.”\nSam: “I can only come on Tuesday. Can I just turn up?”", "first": {"ko": "Sam에게 2~3문장으로 답하세요. 공지의 근거를 사용하고, 허용되는 것과 아직 확인해야 하는 것을 나누세요.", "en": "Reply to Sam in 2–3 sentences. Use evidence from the notice and distinguish what is allowed from what still needs confirmation."}, "new": {"ko": "사무실의 자동 답장: “We are closed on Monday. Tuesday appointments must be confirmed by Friday.” 오늘은 월요일이며 Sam은 아직 연락한 적이 없습니다.", "en": "Office auto-reply: “We are closed on Monday. Tuesday appointments must be confirmed by Friday.” Today is Monday and Sam has not contacted the office before."}, "second": {"ko": "답장을 수정하세요. 이번 화요일 방문을 확정하지 않으면서, 실행 가능한 다음 행동을 제안하세요.", "en": "Revise your reply. Do not promise a visit this Tuesday; suggest a workable next action."}, "reason": {"ko": "처음에는 “Tuesday visits may be possible if you volunteer and arrange them in advance. Contact the office first; don’t just turn up.”처럼 조건을 보존해야 합니다. 새 정보에서는 이번 화요일의 기한이 지났으므로 방문을 약속할 수 없습니다. “Ask about a later Tuesday and get confirmation by the preceding Friday.” 등 대안이 가능합니다. 지난 금요일까지 확인하지 않았다고 특별 허가가 절대 불가능하다고 단정할 필요도 없습니다.", "en": "A good first reply preserves the conditions: “A Tuesday visit may be possible if you volunteer and arrange it in advance. Contact the office first.” With the new information, the normal deadline for this Tuesday has passed. Suggest arranging a later Tuesday by the preceding Friday, or asking whether an exception is possible without assuming one. Do not invent a confirmed appointment."}, "checks": [{"ko": "일반 개방일과 자원봉사 예외를 구별했다.", "en": "I distinguished normal opening from the volunteer exception."}, {"ko": "사전 확인 조건을 답장에 포함했다.", "en": "I preserved the confirmation requirement."}, {"ko": "새 기한을 반영하고 실행 가능한 대안을 제안했다.", "en": "I updated the deadline and offered a feasible next action."}], "trap": {"ko": "“Tuesday is open”과 “Tuesday visits may be arranged”는 같은 뜻이 아닙니다.", "en": "“Tuesday is open” is not the same as “Tuesday visits may be arranged.”"}, "prereq": {"ko": "요일·조건 표현·짧은 공지 읽기", "en": "Days; conditional permission; short notices"}, "minutes": 8}, {"id": "E3", "subject": "english", "level": {"ko": "고등", "en": "High school"}, "title": {"ko": "동의처럼 들리는 우려", "en": "Concern that sounds like agreement"}, "target": "Manager:\n“Your proposal is certainly ambitious. With our current staffing, meeting Friday would be quite an achievement. Could we revisit the scope?”", "first": {"ko": "이 메시지를 무조건 칭찬이나 거절로 분류하지 말고, 가능한 해석 두 가지와 각각의 근거를 쓰세요. 이어서 60단어 이내의 영어 답장을 작성하세요.", "en": "Give two plausible interpretations with evidence rather than labeling this simply praise or rejection. Then write an English reply of no more than 60 words."}, "new": {"ko": "관리자의 추가 설명: “Friday is fixed for a demonstration, not the full release. We can defer nonessential features.”", "en": "The manager clarifies: “Friday is fixed for a demonstration, not the full release. We can defer nonessential features.”"}, "second": {"ko": "답장을 수정해 금요일에 할 일, 뒤로 미룰 일, 확인받아야 할 결정을 구분하세요. 원문에 없는 인력이나 확정 일정을 만들어 내지 마세요.", "en": "Revise your reply to distinguish Friday’s deliverable, deferred work, and a decision requiring confirmation. Do not invent staff or confirmed dates."}, "reason": {"ko": "ambitious는 실제 칭찬일 수 있고, staffing·achievement·revisit the scope는 실현 가능성에 대한 우려를 뒷받침합니다. 비꼼이라고 확정할 근거는 부족합니다. 예: “Thanks for clarifying. I suggest a small Friday demonstration covering the core workflow, with nonessential features deferred. Could you confirm which workflow matters most and approve the reduced scope? I’ll propose a full-release timeline after we check capacity.” 다른 기능 범위도 근거와 확인 절차가 분명하면 가능합니다.", "en": "“Ambitious” may signal genuine appreciation, while staffing and revisiting scope indicate feasibility concerns. Sarcasm is not established. Example: “Thanks for clarifying. I suggest a small Friday demonstration covering the core workflow, with nonessential features deferred. Could you confirm which workflow matters most and approve the reduced scope? I’ll propose a full-release timeline after we check capacity.” Other replies can work if their scope and confirmation requests are coherent."}, "checks": [{"ko": "태도 해석을 문구의 근거로 뒷받침했다.", "en": "I supported interpretations with textual evidence."}, {"ko": "시연과 정식 출시를 구별했다.", "en": "I distinguished demonstration from full release."}, {"ko": "실행안과 확인 질문을 제시하며 약속을 지어내지 않았다.", "en": "I offered a plan and a confirmation request without inventing commitments."}], "trap": {"ko": "어려운 단어를 많이 쓰는 답장보다 상대의 제약을 정확히 반영하는 답장이 더 낫습니다.", "en": "A reply that handles the constraints is stronger than one that merely uses elaborate vocabulary."}, "prereq": {"ko": "완곡한 표현, 이메일의 목적·독자", "en": "Indirect language; email purpose and audience"}, "minutes": 10}, {"id": "K1", "subject": "korean", "level": {"ko": "초급", "en": "Beginner"}, "title": {"ko": "메뉴에 답이 없을 때", "en": "When the menu is not enough"}, "target": "친구: “저는 매운 음식을 못 먹어요.”\n메뉴:\n김치찌개 — 매워요\n된장국 — 보통\n계란찜 — 안 매워요\n\n도움말 / Glossary: 매워요 = spicy; 못 먹어요 = cannot eat; 보통 = regular/normal; 안 매워요 = not spicy", "first": {"ko": "친구에게 무엇을 추천하겠어요? 확실한 메뉴 정보와 확인이 필요한 정보를 나누고, 주문할 때 쓸 한국어 한 문장을 만드세요.", "en": "What would you recommend? Distinguish clear menu information from information needing confirmation. Write one Korean sentence for ordering."}, "new": {"ko": "직원: “계란찜은 다 팔렸어요.”\n다 팔렸어요 = sold out", "en": "The server says: “계란찜은 다 팔렸어요.” (The steamed eggs are sold out.)"}, "second": {"ko": "친구가 먹을 수 있다고 단정하지 말고, 직원에게 할 한국어 질문을 만드세요. 필요한 경우 짧은 한국어와 영어를 함께 써도 됩니다.", "en": "Do not assume another dish is suitable. Write a Korean question to the server. You may combine short Korean with English if needed."}, "reason": {"ko": "처음에는 안 맵다고 명시된 계란찜이 근거 있는 추천입니다. “계란찜 주세요.” 등이 가능합니다. 품절 후에는 보통이라는 말만으로 된장국이 안 맵다고 확정할 수 없습니다. “된장국은 매워요?” 또는 “안 맵게 해 주실 수 있어요?”처럼 정보나 조절 가능성을 묻는 답이 좋습니다. 발화 목적을 이루는 다양한 표현을 인정하며, 고급 높임말을 필수로 하지 않습니다.", "en": "Initially, steamed eggs are explicitly marked not spicy, so “계란찜 주세요” is supported. Once they are sold out, “regular” does not guarantee that the soup is not spicy. Ask “된장국은 매워요?” (Is the soybean soup spicy?) or “안 맵게 해 주실 수 있어요?” (Could you make it not spicy?). Accept different understandable ways to ask; advanced honorific grammar is not required."}, "checks": [{"ko": "명시된 안 매운 메뉴를 근거로 추천했다.", "en": "I based my recommendation on an explicit menu description."}, {"ko": "보통을 안 맵다는 뜻으로 단정하지 않았다.", "en": "I did not assume regular means not spicy."}, {"ko": "직원이 답할 수 있는 확인 질문을 만들었다.", "en": "I created a question the server can answer."}], "trap": {"ko": "정답 메뉴를 맞히는 것보다, 정보가 부족할 때 묻는 것이 이번 과제의 핵심입니다.", "en": "The goal is to ask when information is insufficient, not merely guess the right dish."}, "prereq": {"ko": "주세요·간단한 의문문; 핵심 어휘 뜻 제공", "en": "주세요; simple questions; key vocabulary glossed"}, "minutes": 6}, {"id": "K2", "subject": "korean", "level": {"ko": "중급", "en": "Intermediate"}, "title": {"ko": "거절한 것은 무엇일까?", "en": "What was declined?"}, "target": "나: “목요일 세 시에 같이 발표 연습할까요?”\n동료: “그때는 좀 어려울 것 같아요.”", "first": {"ko": "동료가 확실히 거절한 것과 아직 모르는 것을 구분하세요. 압박하지 않으면서 대화를 이어 가는 한국어 답장을 쓰세요.", "en": "Distinguish what the colleague has declined from what remains unknown. Write a Korean reply that moves the conversation forward without pressure."}, "new": {"ko": "동료: “금요일 오전은 괜찮아요. 다만 열한 시에는 수업이 있어요.”", "en": "The colleague adds: “금요일 오전은 괜찮아요. 다만 열한 시에는 수업이 있어요.” (Friday morning works, but I have a class at eleven.)"}, "second": {"ko": "연습은 40분입니다. 가능한 시간을 제안하고 상대의 확인을 받는 답장을 쓰세요. 수업 전에 이동 시간이 필요한지도 고려하세요.", "en": "Practice takes 40 minutes. Propose a possible time and ask for confirmation. Consider whether travel time is needed before class."}, "reason": {"ko": "처음 발화는 목요일 세 시라는 시간에 대한 어려움을 나타내며, 발표 연습 자체나 상대를 거부했다는 뜻은 확정되지 않습니다. “그러면 언제가 괜찮으세요?” 등이 적절합니다. 추가 정보 뒤에는 “금요일 열 시부터 열 시 사십 분까지 어떠세요? 수업에 가실 시간도 괜찮으세요?”처럼 제안할 수 있습니다. 더 이른 시간도 가능합니다. 오전이라는 말만으로 모든 오전 시간이 가능하다고 단정하지 않습니다.", "en": "The initial reply concerns Thursday at three; it does not establish rejection of the activity or person. “그러면 언제가 괜찮으세요?” is useful. With the new information: “금요일 열 시부터 열 시 사십 분까지 어떠세요? 수업에 가실 시간도 괜찮으세요?” proposes a feasible slot and checks travel time. Earlier slots can also work. Do not assume every morning time is available."}, "checks": [{"ko": "시간의 거절과 활동 자체의 거절을 구별했다.", "en": "I distinguished declining a time from declining the activity."}, {"ko": "40분과 11시 수업을 함께 반영했다.", "en": "I used both the 40-minute duration and the eleven o’clock class."}, {"ko": "상대의 선택과 확인 여지를 남겼다.", "en": "I left room for the colleague to confirm or choose."}], "trap": {"ko": "정중함은 가장 긴 높임말을 고르는 일이 아니라 상대의 제약과 선택을 존중하는 일입니다.", "en": "Politeness is not choosing the longest honorific phrase; it includes respecting constraints and choice."}, "prereq": {"ko": "시간 표현, 완곡한 거절·제안", "en": "Time expressions; indirect refusal and suggestions"}, "minutes": 8}, {"id": "K3", "subject": "korean", "level": {"ko": "고급", "en": "Advanced"}, "title": {"ko": "예외가 겹치는 공지를 고쳐라", "en": "Repair overlapping exceptions"}, "target": "도서관 공지 초안:\n“평일은 오전 9시부터 오후 8시까지 운영합니다. 수요일은 정기 점검으로 오후 6시에 문을 닫습니다. 시험 기간에는 오후 10시까지 연장합니다. 공휴일은 휴관합니다.”", "first": {"ko": "시험 기간의 수요일에는 몇 시에 닫나요? 한 가지를 정답이라고 우기지 말고, 충돌하는 규칙을 찾으세요. 운영자에게 할 확인 질문과 모호하지 않은 공지 수정안을 쓰세요. 수정안에서 자신이 새로 정한 정책은 표시하세요.", "en": "What is the closing time on a Wednesday during exams? Identify conflicting rules instead of insisting on one answer. Write a clarification question and an unambiguous Korean notice. Mark any policy you introduce."}, "new": {"ko": "운영자 확인: “시험 기간에도 수요일 점검은 해야 합니다. 공휴일에는 시험 기간이어도 열지 않습니다.”", "en": "The operator confirms: “시험 기간에도 수요일 점검은 해야 합니다. 공휴일에는 시험 기간이어도 열지 않습니다.” (Wednesday maintenance still applies during exams, and public holidays remain closed.)"}, "second": {"ko": "확인된 정책을 반영해 최종 공지를 쓰세요. 시험 기간 수요일, 시험 기간 목요일, 시험 기간 공휴일의 세 사례를 덧붙여 독자가 규칙을 검증할 수 있게 하세요.", "en": "Write the final Korean notice using the confirmed policy. Add three test cases: an exam-period Wednesday, an exam-period Thursday, and an exam-period public holiday."}, "reason": {"ko": "초안은 수요일 18시와 시험 기간 22시 중 무엇이 우선하는지 명확하지 않습니다. 최종 예: “공휴일은 시험 기간에도 휴관합니다. 수요일은 시험 기간 여부와 관계없이 09:00~18:00 운영합니다. 공휴일·수요일을 제외한 평일은 시험 기간에 09:00~22:00, 그 외에는 09:00~20:00 운영합니다.” 사례: 공휴일 아닌 시험 수요일 18시, 공휴일 아닌 시험 목요일 22시, 시험 기간 공휴일 휴관. 주말 정책은 원문에 없으므로 새로 지어내지 않습니다. 표현이 달라도 예외 우선순위가 같고 명확하면 인정합니다.", "en": "The draft does not clearly rank Wednesday’s 18:00 limit against the exam-period 22:00 extension. A valid final notice states: holidays are always closed; Wednesdays are 09:00–18:00 even during exams; other non-holiday weekdays are 09:00–22:00 during exams and 09:00–20:00 otherwise. Test cases must say the Wednesday and Thursday are not holidays. Weekend policy is unspecified and should not be invented. Different wording is acceptable if the priorities are clear."}, "checks": [{"ko": "초안의 모호함을 규칙 충돌로 설명했다.", "en": "I explained the ambiguity as a conflict between rules."}, {"ko": "수요일과 공휴일의 예외 우선순위를 분명히 했다.", "en": "I made Wednesday and holiday priorities explicit."}, {"ko": "반례가 될 수 있는 세 사례로 수정안을 검증했다.", "en": "I tested the revised notice against three overlapping cases."}], "trap": {"ko": "모호한 원문에서 출제자의 의도를 추측해 맞히는 것보다, 확인하고 명확하게 고치는 능력을 평가합니다.", "en": "This evaluates clarifying and repairing ambiguity, not guessing an author’s hidden intention."}, "prereq": {"ko": "공지문, 조건·예외·우선순위 표현", "en": "Notices; conditions, exceptions and precedence"}, "minutes": 12}];
const UI={ko:{heading:'답보다, 생각이 움직이는 순간',intro:'먼저 판단하고 → 새 정보를 만나고 → 생각을 고쳐 보세요. 정답을 빨리 고르는 시험이 아니라, 판단이 달라지는 이유를 살펴보는 9개의 실험입니다.',all:'전체 9개',math:'수학',english:'영어',korean:'한국어',export:'내 답안 내려받기',minutes:'분',prereq:'준비 지식',phase1:'01 · 먼저 판단하기',phase2:'02 · 새 정보로 다시 생각하기',phase3:'03 · 판단을 비교하기',placeholder:'답뿐 아니라 왜 그렇게 생각하는지 적어 보세요.',reveal:'새 정보 열기',compare:'내 판단 비교하기',save:'답안은 이 브라우저에만 자동 저장됩니다.',unsupported:'이 브라우저에서 저장할 수 없습니다. 답안을 내려받아 보관하세요.',original:'처음 판단',revised:'수정한 판단',example:'가능한 풀이와 다른 해석',rubric:'스스로 확인하는 기준',rubricNote:'각 기준은 자기 점검용입니다. 0=아직 다루지 않음, 1=일부 설명, 2=근거와 조건까지 설명. 자동으로 사고 능력을 판정하지 않습니다.',unset:'선택하지 않음',r0:'0 · 아직 다루지 않음',r1:'1 · 일부 설명',r2:'2 · 근거와 조건까지 설명',trap:'다시 생각할 지점',next:'다음 과제',reset:'이 과제 다시 시작',resetConfirm:'이 과제의 답안과 자기 점검을 지우고 다시 시작할까요?',sim:'설계 실험대',width:'가로',height:'세로',test:'조건 확인',complete:'판단 비교까지 연 과제',footer:'시범 9개 · 안내 언어: 한국어/영어 · 목표 언어의 원문은 보존합니다. 작성자 자체 점검만 마쳤으며 교사·독립 검토·실제 학습 효과 검증은 아직 없습니다. 외부 서버로 답안을 보내지 않습니다.',minAnswer:'먼저 자신의 판단을 적어 주세요.',score:'자기 점검',done:'기준 확인'},en:{heading:'A moment to change your mind',intro:'Make a judgment → meet new information → revise your thinking. Nine experiments in reasoning, not a race to choose an answer.',all:'All 9',math:'Math',english:'English',korean:'Korean',export:'Download my responses',minutes:'min',prereq:'Starting knowledge',phase1:'01 · Make your first judgment',phase2:'02 · Think again with new information',phase3:'03 · Compare your judgments',placeholder:'Explain why, not only what you think.',reveal:'Reveal new information',compare:'Compare my judgments',save:'Responses save only in this browser.',unsupported:'Storage is unavailable. Download your responses to keep them.',original:'First judgment',revised:'Revised judgment',example:'A possible solution and alternatives',rubric:'Self-review criteria',rubricNote:'For self-review only: 0=not addressed, 1=partly explained, 2=explained with evidence and conditions. This does not automatically judge your thinking ability.',unset:'Not rated',r0:'0 · Not addressed',r1:'1 · Partly explained',r2:'2 · Evidence and conditions',trap:'A point to reconsider',next:'Next task',reset:'Restart this task',resetConfirm:'Delete this task’s responses and self-review and start again?',sim:'Design workbench',width:'Width',height:'Height',test:'Check constraints',complete:'tasks opened through comparison',footer:'Nine pilot tasks · Korean/English instructions · Target-language texts remain intact. Author self-check only; no independent teacher review or evidence of learning gains yet. Responses are not sent to an external server.',minAnswer:'Write your own judgment first.',score:'Self-review',done:'criteria rated'}};
const KEY='thinking-lab-pilot-01';let store={};let storageOK=true;try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{storageOK=false}let lang='ko',filter='all',selected='M1';const $=s=>document.querySelector(s);const tr=x=>x?.[lang]??x;const t=k=>UI[lang][k];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function state(){return store[selected]??(store[selected]={first:'',second:'',phase:1,ratings:{},w:4,h:6})}function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch{storageOK=false}const e=$('#saved');if(e)e.textContent=t(storageOK?'save':'unsupported')}
function shell(){document.documentElement.lang=lang;$('#heading').textContent=t('heading');$('#intro').textContent=t('intro');$('#footer').textContent=t('footer');for(const b of document.querySelectorAll('[data-filter]')){b.textContent=t(b.dataset.filter);b.setAttribute('aria-pressed',String(filter===b.dataset.filter))}$('#export').textContent=t('export');$('#progress').textContent=lang==='ko'?`${TASKS.filter(q=>store[q.id]?.phase===3).length} / 9 ${t('complete')}`:`${TASKS.filter(q=>store[q.id]?.phase===3).length} / 9 ${t('complete')}`;$('#list').innerHTML=TASKS.filter(q=>filter==='all'||q.subject===filter).map(q=>`<button class="taskbtn" data-id="${q.id}" aria-current="${q.id===selected}"><small>${q.id} · ${t(q.subject)} · ${esc(tr(q.level))}</small>${esc(tr(q.title))}${store[q.id]?.phase===3?' ✓':''}</button>`).join('');for(const b of document.querySelectorAll('[data-id]'))b.onclick=()=>{selected=b.dataset.id;render()}}
function render(){shell();const q=TASKS.find(x=>x.id===selected),s=state();$('#task').innerHTML=`<div class="meta">${t(q.subject)} · ${esc(tr(q.level))} · ${q.minutes} ${t('minutes')}</div><h2>${esc(tr(q.title))}</h2><p class="small">${t('prereq')}: ${esc(tr(q.prereq))}</p><section class="panel target">${esc(q.target)}</section><section class="panel"><div class="phase">${t('phase1')}</div><label for="first">${esc(tr(q.first))}</label><textarea id="first" ${s.phase>1?'readonly':''} placeholder="${t('placeholder')}">${esc(s.first)}</textarea>${s.phase===1?`<button class="primary" id="reveal" ${!s.first.trim()?'disabled':''}>${t('reveal')}</button>`:''}</section>${s.phase>=2?`<section class="panel new"><div class="phase">${t('phase2')}</div><p>${esc(tr(q.new))}</p></section><section class="panel"><label for="second">${esc(tr(q.second))}</label><textarea id="second" placeholder="${t('placeholder')}">${esc(s.second)}</textarea><button class="primary" id="compare" ${!s.second.trim()?'disabled':''}>${t('compare')}</button></section>`:''}${q.id==='M1'?`<details class="panel"><summary>${t('sim')}</summary><div class="sim"><div class="row"><label>${t('width')} <input id="w" type="number" min="1" max="24" step="1" value="${esc(s.w)}"> m</label><label>${t('height')} <input id="h" type="number" min="1" max="24" step="1" value="${esc(s.h)}"> m</label><button id="check">${t('test')}</button></div><div id="simstatus" class="status" role="status"></div><div id="garden"></div></div></details>`:''}${s.phase===3?`<section class="panel"><div class="phase">${t('phase3')}</div><div class="compare"><div><h3>${t('original')}</h3><div class="answer">${esc(s.first)}</div></div><div><h3>${t('revised')}</h3><div class="answer">${esc(s.second)}</div></div></div></section><section class="panel"><h3>${t('example')}</h3><p>${esc(tr(q.reason))}</p><p class="note"><strong>${t('trap')}</strong><br>${esc(tr(q.trap))}</p></section><section class="panel"><h3>${t('rubric')}</h3><p class="small">${t('rubricNote')}</p>${q.checks.map((c,i)=>`<div class="check"><label for="r${i}">${esc(tr(c))}</label><select id="r${i}" data-rating="${i}">${['',0,1,2].map(v=>`<option value="${v}" ${String(s.ratings[i]??'')===String(v)?'selected':''}>${v===''?t('unset'):t('r'+v)}</option>`).join('')}</select></div>`).join('')}<div id="score" class="score"></div></section>`:''}<div class="row"><button id="next">${t('next')}</button><button id="reset">${t('reset')}</button></div><p id="saved" class="small saved" role="status">${t(storageOK?'save':'unsupported')}</p>`;
$('#first').oninput=e=>{s.first=e.target.value;save();if($('#reveal'))$('#reveal').disabled=!s.first.trim()};if($('#second'))$('#second').oninput=e=>{s.second=e.target.value;save();$('#compare').disabled=!s.second.trim()};if($('#reveal'))$('#reveal').onclick=()=>{if(!s.first.trim())return;s.phase=2;save();render();$('#second').focus()};if($('#compare'))$('#compare').onclick=()=>{if(!s.second.trim())return;s.phase=3;save();render();$('#score').scrollIntoView({block:'nearest'})};$('#next').onclick=()=>{const list=TASKS.filter(x=>filter==='all'||x.subject===filter);selected=list[(list.findIndex(x=>x.id===selected)+1)%list.length].id;render();window.scrollTo({top:0})};$('#reset').onclick=()=>{if(confirm(t('resetConfirm'))){delete store[selected];save();render()}};for(const x of document.querySelectorAll('[data-rating]'))x.onchange=()=>{if(x.value==='')delete s.ratings[x.dataset.rating];else s.ratings[x.dataset.rating]=Number(x.value);save();score()};if($('#score'))score();if($('#check'))$('#check').onclick=checkGarden;}
function score(){const s=state();const v=Object.values(s.ratings);$('#score').textContent=`${t('score')}: ${v.length}/3 ${t('done')}`}
function gardenResult(w,h,phase){const valid=Number.isInteger(w)&&Number.isInteger(h)&&w>0&&h>0&&w<=24&&h<=24;return {valid,area:valid?w*h:null,perimeter:valid?2*(w+h):null,areaOK:valid&&w*h===24,fenceOK:valid&&2*(w+h)<=22,bedOK:valid&&Math.max(w,h)>=8,phase}}
function checkGarden(){const s=state();const w=Number($('#w').value),h=Number($('#h').value);s.w=w;s.h=h;save();const r=gardenResult(w,h,s.phase);if(!r.valid){$('#simstatus').textContent=lang==='ko'?'1~24 사이의 양의 정수를 입력하세요.':'Enter positive integers from 1 to 24.';$('#garden').innerHTML='';return}$('#simstatus').textContent=lang==='ko'?`넓이 ${r.area} m² ${r.areaOK?'✓':'✕'} / 둘레 ${r.perimeter} m ${r.fenceOK?'✓':'✕'}${s.phase>=2?` / 8m 화단 ${r.bedOK?'✓':'✕'}`:''}`:`Area ${r.area} m² ${r.areaOK?'✓':'✕'} / Perimeter ${r.perimeter} m ${r.fenceOK?'✓':'✕'}${s.phase>=2?` / 8 m bed ${r.bedOK?'✓':'✕'}`:''}`;const L=Math.max(w,h),S=Math.min(w,h),k=220/Math.max(8,L),height=S*k;$('#garden').innerHTML=`<svg viewBox="0 0 310 ${height+85}" role="img" aria-label="${esc(w+' by '+h+' metre garden')}"><rect x="35" y="25" width="${L*k}" height="${height}" fill="#d7ebd9" stroke="#146856" stroke-width="2"/><text x="35" y="18" font-size="14">${L} m</text><text x="${L*k+43}" y="${height/2+30}" font-size="14">${S} m</text>${s.phase>=2?`<path d="M35 ${height+45}h${8*k}" stroke="${r.bedOK?'#146856':'#a64229'}" stroke-width="5"/><text x="35" y="${height+70}" font-size="14">8 m</text>`:''}</svg>`;}
$('#language').onchange=e=>{lang=e.target.value;render()};for(const b of document.querySelectorAll('[data-filter]'))b.onclick=()=>{filter=b.dataset.filter;const list=TASKS.filter(q=>filter==='all'||q.subject===filter);if(!list.some(q=>q.id===selected))selected=list[0].id;render()};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'thinking-lab-responses-1',exportedAt:new Date().toISOString(),tasks:TASKS.map(q=>({id:q.id,title:q.title,responses:store[q.id]??null}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='thinking-lab-responses.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></body></html>
