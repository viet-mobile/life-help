<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · LIFE.HELP</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
  main { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 0; }
  p { margin: 0; color: #475569; }
  button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px; background: #0f172a; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="t">You are offline</h1>
  <p id="d">Check your internet connection and try again.</p>
  <button id="r" type="button">Try again</button>
</main>
<script>
  // Minimal localized fallback (same strings as messages/{en,ko}.json system.offline*): Korean for Korean browsers, English otherwise.
  var ko = /^ko\b/i.test(navigator.language || "");
  if (ko) {
    document.documentElement.lang = "ko";
    document.title = "인터넷에 연결되어 있지 않아요 · LIFE.HELP";
    document.getElementById("t").textContent = "인터넷에 연결되어 있지 않아요";
    document.getElementById("d").textContent = "인터넷 연결을 확인한 뒤 다시 시도해 주세요.";
    document.getElementById("r").textContent = "다시 시도";
  }
  document.getElementById("r").addEventListener("click", function () { location.reload(); });
</script>
</body>
</html>
