<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밈 수학 · 전 개념 영상 라이브러리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#172443;font:16px/1.65 system-ui,sans-serif}header,main,footer{max-width:1240px;margin:auto;padding:28px 22px}header{padding-top:45px}h1{font-size:clamp(29px,4.5vw,53px);line-height:1.18;letter-spacing:-.045em;margin:12px 0}h2{font-size:21px;line-height:1.4;margin:8px 0}.eyebrow{font-size:13px;font-weight:750;letter-spacing:.12em;color:#087f8c}.intro{max-width:800px;color:#52627d}.metrics{display:flex;gap:15px;flex-wrap:wrap;margin:22px 0}.metric{background:#fff;border:1px solid #dce4ed;border-radius:16px;padding:12px 18px;font-size:14px}.metric strong{font-size:26px;margin-right:8px;color:#087f8c}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}input,button,select,a.download{font:inherit;border:1px solid #c5cedd;border-radius:10px;padding:10px 12px;background:#fff;color:#172443;max-width:100%}button,a.download{cursor:pointer}input{flex:1;min-width:180px}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #087f8c;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{min-width:0;border:1px solid #dce4ed;background:#fff;border-radius:20px;overflow:hidden;scroll-margin-top:20px;box-shadow:0 7px 24px #17244305} .motion,.still-image{position:relative}.motion canvas,.still-image canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.motion video::-webkit-media-controls-fullscreen-button{display:none}.motion video{width:100%;aspect-ratio:16/9;display:block;background:#f7f9fd}section{padding:18px}.tag{font-size:12px;color:#087f8c;font-weight:750;overflow-wrap:anywhere}section p{font-size:14px;color:#52627d;min-height:66px}.formula{font:17px/1.6 system-ui,sans-serif;overflow-wrap:anywhere;background:#f2f5fb;border-radius:10px;padding:10px;margin:12px 0}.download{text-decoration:none;font-size:13px!important}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:12px}.strip img{width:100%}details{font-size:13px;margin-top:16px}.refs{font-size:12px;color:#66758e;overflow-wrap:anywhere}.paging{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px 0}.noresults{padding:50px;text-align:center;color:#66758e}footer{font-size:13px;color:#64728a}body>main>p{color:#536680;font-size:14px}.end{margin-top:12px;display:none}.end.visible{display:block}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}header{padding-top:28px}.metrics{gap:8px}.metric{padding:8px 11px}.metric strong{font-size:22px}section p{min-height:0}select{width:100%}}
</style>
<header><div class="eyebrow">MIM / MATHEMATICS IN MOTION</div><h1>수학 움직임으로 발견하는<br>수학의 원리.</h1><p class="intro">밈이 세고, 나누고, 움직이고, 비교합니다. 초등학교부터 고등학교 선택과목까지 개념의 핵심 관계를 짧은 장면으로 살펴보세요.</p><div class="metrics"><div class="metric"><strong id="total">—</strong>영상</div><div class="metric"><strong id="linked">435</strong>성취기준 참조</div></div><div class="tools"><input id="search" type="search" placeholder="개념 또는 성취기준 코드 검색" aria-label="개념 검색"><select id="grade" aria-label="학년"><option value="all">모든 학년·선택과목</option></select><select id="course" aria-label="과목"><option value="all">모든 교육과정 과목</option></select></div></header>
<main><p id="status" role="status"></p><div class="grid" id="grid"></div><div class="paging"><button id="prev">이전 12편</button><span id="page"></span><button id="next">다음 12편</button></div></main><footer>무음 · 자동 재생 없음 · 0.5배속과 정지 그림 지원. 내부 저작 정보는 화면에 전달하지 않습니다. 기본 재생을 완료해도 문제 풀이 완료나 학습 진도로 집계하지 않습니다.</footer>
<script type="module">
import {localizeVideo} from "./localized-video.js";
const overlays=await fetch("i18n/public/overlays.json").then(r=>r.json());
const $=s=>document.querySelector(s),esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const catalog=await fetch('i18n/public/index.json').then(r=>{if(!r.ok)throw Error('Translation index unavailable');return r.json()});
const requested=new URL(location.href).searchParams.get('lang')||'ko';const lang=Object.hasOwn(catalog.locales,requested)?requested:'en';
const record=catalog.locales[lang];const bytes=await fetch(record.path).then(r=>{if(!r.ok)throw Error('Translation unavailable');return r.arrayBuffer()});
const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');if(digest!==record.sha256)throw Error('Translation hash mismatch');
const pack=JSON.parse(new TextDecoder().decode(bytes));if(pack.sourceCatalogSHA256!==catalog.sourceCatalogSHA256||Object.keys(pack.values).length!==catalog.keyCount)throw Error('Translation source mismatch');
function tr(s){const key=catalog.sourceToKey[s];if(!key)return s;const value=pack.values[key];if(typeof value!=='string'||!value.trim())throw Error('Incomplete translation');return value}
function t(key,args={}){let value=pack.values[catalog.ui[key]];if(typeof value!=='string')throw Error('Missing UI translation');for(const [k,v]of Object.entries(args))value=value.replaceAll('{'+k+'}',String(v));return value}
document.documentElement.lang=lang;document.documentElement.dir=catalog.rtl.includes(lang)?'rtl':'ltr';document.title=t('brand');$('h1').textContent=t('heading');$('.intro').textContent=t('intro');
$('#search').placeholder=t('search');$('#search').setAttribute('aria-label',t('search'));$('#grade option').textContent=t('allGrades');$('#grade').setAttribute('aria-label',t('allGrades'));$('#course option').textContent=t('allCourses');$('#course').setAttribute('aria-label',t('allCourses'));$('#prev').textContent=t('previous');$('#next').textContent=t('next');$('footer').textContent=t('footer');
for(const [i,key]of ['videos','standards'].entries()){const m=document.querySelectorAll('.metric')[i];while(m.childNodes.length>1)m.lastChild.remove();m.append(document.createTextNode(' '+t(key)))}
const language=document.createElement('select');language.id='language';language.setAttribute('aria-label',t('language'));const names=new Intl.DisplayNames([lang],{type:'language'});for(const code of Object.keys(catalog.locales))language.add(new Option(names.of(code)||code,code));language.value=lang;language.onchange=()=>{const u=new URL(location.href);u.searchParams.set('lang',language.value);location.href=u.href};$('header .tools').append(language);
const data=await fetch('episodes.public.json').then(r=>r.json());let page=0,list=[];const size=12;const gradeLabels={E1:'초1',E2:'초2',E3:'초3',E4:'초4',E5:'초5',E6:'초6',M1:'중1',M2:'중2',M3:'중3',H1:t('H1'),H2:t('H2'),H3:t('H3'),EL:t('EL')};
$('#total').textContent=data.episodeCount;$('#linked').textContent=data.standardCount;
for(const [g,label] of Object.entries(gradeLabels)){const o=new Option(t(g),g);$('#grade').add(o)}
const courses=new Map();for(const e of data.episodes)e.courseIds.forEach((c,i)=>courses.set(c,e.courseTitles[i]));for(const [id,title]of courses)$('#course').add(new Option(tr(compactCourses([title])[0]),id));
function compactCourses(titles){const names=[...new Set(titles.map(t=>t==='공통수학1, 공통수학2'?'공통수학':t==='기본수학1, 기본수학2'?'기본수학':t))];return names.length>1?names.filter(t=>t!=='수학'):names}
function cardTag(e){const school=/^[EM][1-6]$/.test(e.placement);const labels=school?[gradeLabels[e.placement],...e.domains]:[...(e.placement==='EL'?[]:[gradeLabels[e.placement]||e.placement]),...compactCourses(e.courseTitles)];return [...new Set(labels)].map(tr).map(esc).join(' · ')}
function filtered(){const q=$('#search').value.trim().toLowerCase();return data.episodes.filter(e=>($('#grade').value==='all'||e.placement===$('#grade').value||e.alsoUsedFor.some(a=>a.placement===$('#grade').value))&&($('#course').value==='all'||e.courseIds.includes($('#course').value))&&(!q||(tr(e.title)+' '+e.title+' '+tr(e.formula)+' '+e.standardCodes.join(' ')+' '+e.courseTitles.join(' ')+' '+e.alsoUsedFor.map(a=>a.title).join(' ')).toLowerCase().includes(q)))}
function focusEpisode(id){const i=list.findIndex(e=>e.id===id);if(i<0)return;page=Math.floor(i/size);render();requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'}));history.replaceState(null,'','#'+id)}
function render(){list=filtered();const pages=Math.max(1,Math.ceil(list.length/size));page=Math.min(page,pages-1);$('#status').textContent=t('progress',{total:list.length,start:list.length?page*size+1:0,end:Math.min((page+1)*size,list.length)});$('#grid').replaceChildren();$('#prev').disabled=page===0;$('#next').disabled=page>=pages-1;$('#page').textContent=`${page+1} / ${pages}`;
for(const e of list.slice(page*size,(page+1)*size)){const a=document.createElement('article');a.id=e.id;a.innerHTML=`<div class="motion"><video controls controlslist="nofullscreen nodownload noremoteplayback" disablepictureinpicture playsinline preload="none" poster="${esc(overlays[e.id]?"neutral/"+e.poster:e.poster)}" aria-label="${esc(tr(e.title))}"><source src="${esc(overlays[e.id]?"neutral/"+e.video:e.video)}" type="video/mp4"></video><canvas aria-hidden="true"></canvas></div><section><div class="tag">${cardTag(e)}</div><h2>${esc(tr(e.title))}</h2>${overlays[e.id]?.nodes.length?`<div class="motion-transcript" style="font-size:14px;line-height:1.6">${overlays[e.id].nodes.map(n=>esc(pack.values[n.key])).join(" · ")}</div>`:""}<p>${esc(tr(e.description))}</p><div class="formula" dir="ltr" aria-label="${esc(t('mathExpression'))}">${esc(tr(e.formula))}</div><div class="tools"><button class="replay">${esc(t('replay'))}</button><select class="speed" aria-label="${esc(t('speed'))}"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option></select><a class="download" href="${esc(e.video)}" download>${esc(t('download'))}</a></div><button class="end">${esc(t('nextConcept'))} →</button><details><summary>${esc(t('stillFrames'))}</summary><div class="strip">${e.frames.map((f,i)=>`<span class="still-image"><img loading="lazy" src="${esc(overlays[e.id]?"neutral/"+f:f)}" alt="${esc(t('frameTime',{seconds:[0,3,6,8,9.97][i]}))}"><canvas aria-hidden="true" data-frame="${[0,3,6,8,9.97][i]}"></canvas></span>`).join('')}</div></details><details><summary>${esc(t('curriculum'))}</summary><div class="refs">${e.standardCodes.map(esc).join(' · ')}</div></details></section>`;
const v=a.querySelector('video');if(overlays[e.id]){localizeVideo(v,a.querySelector('canvas'),overlays[e.id],pack.values,catalog.rtl.includes(lang));a.querySelector('.download').remove();for(const canvas of a.querySelectorAll('.strip canvas'))localizeVideo({currentTime:Number(canvas.dataset.frame),paused:true,addEventListener(){}},canvas,overlays[e.id],pack.values,catalog.rtl.includes(lang));}const next=a.querySelector('.end');v.addEventListener('play',()=>document.querySelectorAll('video').forEach(x=>{if(x!==v)x.pause()}));v.onended=()=>next.classList.add('visible');a.querySelector('.replay').onclick=()=>{v.currentTime=0;v.play()};a.querySelector('.speed').onchange=ev=>v.playbackRate=+ev.target.value;next.onclick=()=>{const index=list.findIndex(x=>x.id===e.id);if(list[index+1])focusEpisode(list[index+1].id);else{next.textContent=t('lastConcept');next.disabled=true}};$('#grid').append(a)}
if(!list.length){const n=document.createElement('div');n.className='noresults';n.textContent=t('noResults');$('#grid').append(n)}}
const initialGrade=new URL(location.href).searchParams.get('grade');if(initialGrade&&[...$('#grade').options].some(o=>o.value===initialGrade))$('#grade').value=initialGrade;
for(const id of ['#grade','#course'])$(id).onchange=()=>{page=0;render()};$('#search').oninput=()=>{page=0;render()};$('#prev').onclick=()=>{page--;render();$('#status').scrollIntoView()};$('#next').onclick=()=>{page++;render();$('#status').scrollIntoView()};function navigateHash(){const id=location.hash.slice(1);if(!id){page=0;render();return}if(!data.episodes.some(e=>e.id===id))return;if(!filtered().some(e=>e.id===id)){$('#grade').value='all';$('#course').value='all';$('#search').value=''}list=filtered();focusEpisode(id)}
window.addEventListener('hashchange',navigateHash);render();if(location.hash)navigateHash();
</script></html>
