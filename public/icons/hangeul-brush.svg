<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Traditional Korean Calligraphy Seal & Brush Background -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#FFFBF5" stroke="#E2D9C8" stroke-width="1.5"/>
  <rect x="5" y="5" width="38" height="38" rx="8" fill="#FBF7EE"/>
  <!-- Calligraphic character group -->
  <g fill="#1F2937">
    <!-- Character: 한 (Left) -->
    <!-- ㅎ top dot -->
    <path d="M11 11.5 C12 11 14 11 15 12 C15.5 12.5 14.5 13.5 13.5 13.5 C12.5 13.5 11.5 12.5 11 11.5 Z"/>
    <!-- ㅎ horizontal bar (clerical wave: 잠두안미) -->
    <path d="M8.5 15.5 C10 15 16 15 18 15.2 C19 15.3 19.5 16.2 18.5 16.8 C17.5 17.2 10.5 17.5 8.5 16.8 C7.8 16.5 8 15.8 8.5 15.5 Z"/>
    <!-- ㅎ circle (이응) -->
    <path d="M13.5 18 C11.2 18 9.5 19.5 9.5 21.5 C9.5 23.5 11.2 25 13.5 25 C15.8 25 17.5 23.5 17.5 21.5 C17.5 19.5 15.8 18 13.5 18 Z M13.5 20 C14.6 20 15.5 20.7 15.5 21.5 C15.5 22.3 14.6 23 13.5 23 C12.4 23 11.5 22.3 11.5 21.5 C11.5 20.7 12.4 20 13.5 20 Z"/>
    <!-- ㅏ vertical stem -->
    <path d="M21 12 C21.5 12 22.2 12.3 22.2 13 L22.2 25 C22.2 25.8 21.5 26 21 26 C20.5 26 20 25.8 20 25 L20 13 C20 12.3 20.5 12 21 12 Z"/>
    <!-- ㅏ horizontal branch -->
    <path d="M22 18 C22.8 18 24.5 17.8 25.2 18.2 C25.8 18.5 25.5 19.5 24.8 19.8 C24 20.2 22.8 20 22 20 Z"/>
    <!-- ㄴ base corner and wide clerical bottom bar -->
    <path d="M10 27 C10.5 27 11 27.5 11 28.2 L11 34 C11 34.5 11.5 35 12.2 35 L22.5 35 C23.8 35 25 34.5 25.8 35.2 C26.2 35.6 25.8 36.8 24.8 37 C23 37.2 12 37.2 10.5 36.5 C9.5 36 9.2 35 9.2 34 L9.2 28.2 C9.2 27.5 9.5 27 10 27 Z"/>

    <!-- Character: 글 (Right) -->
    <!-- ㄱ top bar & turn -->
    <path d="M29 13.5 C31 13.2 37 13.2 38.5 13.5 C39.5 13.8 40 14.5 39.8 15.5 L39 19.5 C38.8 20.2 38 20.5 37.3 20.2 C36.8 20 37 19.2 37.2 18.5 L37.5 15.5 C37.5 15.2 37.2 15 36.8 15 L31 15.2 C30.2 15.2 29.5 14.8 29 14.2 C28.8 13.8 28.8 13.5 29 13.5 Z"/>
    <!-- ㅡ horizontal clerical wave -->
    <path d="M28.5 22.5 C30 22 38 22 40 22.2 C41 22.3 41.5 23.2 40.5 23.8 C39.5 24.2 30.5 24.5 28.5 23.8 C27.8 23.5 28 22.8 28.5 22.5 Z"/>
    <!-- ㄹ clerical brush snake -->
    <path d="M30 26 C31 25.8 37 25.8 38 26 C38.8 26.2 39 27 38.8 27.8 L38.2 29.2 C38 29.8 37.2 30.2 36.5 30 L32.5 30 C31.8 30 31.5 30.5 31.5 31 L31.5 32.5 C31.5 33 32 33.2 32.8 33.2 L37.5 33.2 C38.8 33.2 40 32.8 40.8 33.5 C41.2 33.9 40.8 35.1 39.8 35.3 C38 35.5 32 35.5 30.8 35 C29.8 34.5 29.5 33.5 29.5 32 L29.5 30.5 C29.5 29.5 30.2 28.8 31.2 28.8 L36 28.8 L36.5 27.5 L30.8 27.5 C30 27.5 29.5 27 29.5 26.5 C29.5 26.2 29.8 26 30 26 Z"/>
  </g>
  <!-- Traditional Red Seal Accent (소담한 붉은 낙관 인장) -->
  <rect x="36" y="36" width="7" height="7" rx="2" fill="#DC2626"/>
  <rect x="37.5" y="37.5" width="4" height="4" rx="1" fill="#FFFBF5"/>
</svg>